define host {
    use                     linux-server
    host_name               knowledge-platform
    alias                   Enterprise Knowledge Platform
    address                 host.docker.internal
}

define command {
    command_name check_backend_http
    command_line $USER1$/check_http -H host.docker.internal -p 8000 -u /health -s '"status":"ok"'
}

define command {
    command_name check_frontend_http
    command_line $USER1$/check_http -H host.docker.internal -p 5173
}

define service {
    use                     generic-service
    host_name               knowledge-platform
    service_description     FastAPI Backend Health
    check_command           check_backend_http
}

define service {
    use                     generic-service
    host_name               knowledge-platform
    service_description     React Frontend HTTP
    check_command           check_frontend_http
}
